[project]
name = "ai-co-scientist"
version = "0.1.0"
description = "AI Co-Scientist — A2A/MCP/하네스 멀티에이전트 스캐폴딩"
requires-python = ">=3.12"
dependencies = [
    "a2a-sdk>=1.1,<2",
    "mcp>=1.28",
    "httpx>=0.27",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "starlette>=0.37",
    "langgraph>=1.2.9",
    "numpy>=2.5.1",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.26", "ruff>=0.8"]
baseline = [
    "torch>=2.4",
    "opencv-python>=4.10",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "tqdm>=4.66",
    "wandb>=0.18",
]
lightning = [
    "lightning-sdk>=2025",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_co_scientist"]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu124" }]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:a2a.utils.proto_utils",
]

[tool.ruff]
line-length = 100
