[project]
name = "ai-co-scientist"
version = "0.1.0"
description = "AI Co-Scientist — sub-agent 자율 연구 하네스 (SEM→Depth)"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "numpy>=2.5.1",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.26", "ruff>=0.8"]
baseline = [
    "torch>=2.4",
    "opencv-python>=4.10",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "tqdm>=4.66",
    "wandb>=0.18",
    "segmentation-models-pytorch>=0.3",
    "matplotlib>=3.11.1",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_co_scientist"]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu124" }]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
