# 실험 하네스 설정. 에이전트 포트·mock 스위치는 A2A 구조와 함께 제거됨.
paths:
  registry: "runtime/registry.jsonl"        # 실험 기록소 (단일 진실)
  registry_doc: "docs/experiment-registry.md"
  data_dir: "data"
  cache_dir: "runtime/cache"
  ckpt_dir: "runtime/ckpt"
  submission_dir: "runtime/submissions"

# 최종 판정 기준 — 모든 validation 지표는 이 도메인과 대조된다.
target:
  x_domain: real          # test 입력 = 실측 SEM
  y_source: real_depth    # test 정답 = 실제 depth (우리에겐 없음 → 리더보드가 유일 판정)

train:
  epochs: 15
  batch_size: 128
  lr: 1.0e-3
  loss: l1
  val_fraction: 0.2
