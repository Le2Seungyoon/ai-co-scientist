agents:
  pm: { port: 9001 }
  research: { port: 9002 }
  analysis: { port: 9003 }
  coder: { port: 9004 }
  executor: { port: 9005 }
  critic: { port: 9006 }
  harness_engineer: { port: 9007 }

paths:
  shared_log_db: "runtime/shared_log.sqlite3"
  rules_dir: "rules"
  wandb_db: "runtime/wandb.sqlite3"
  lightning_db: "runtime/lightning.sqlite3"
  dacon_db: "runtime/dacon.sqlite3"
  toy_data_dir: "runtime/toy_data"

mock:
  llm: true
  lightning: true
  dacon: true
  wandb: true
  websearch: true

pm:
  max_cycles_default: 3
  a2a_timeout_s: 600     # 에이전트 응답 대기 — 실 LLM은 self-correct 포함 수 분 소요
  coder_retry_limit: 2
  replan_limit: 2
  poll_interval_s: 0.5
  poll_timeout_s: 120
  critic_round_limit: 2
  human_resume_limit: 1

executor_stub:
  run_delay_s: 0.2

executor:
  run_timeout_s: 5

coder:
  self_correct_limit: 1
  smoke_timeout_s: 5
  workspace_dir: "runtime/workspace"

llm:
  provider: mock       # mock | gemini — env COSCIENTIST_LLM_PROVIDER가 우선.
                       # 기본은 mock 유지(테스트 오프라인 불변식) — 실 기동 시 env로 gemini 켠다
  scenario: default    # env COSCIENTIST_MOCKLLM_SCENARIO가 우선 (mock 전용)
  gemini:
    model: gemma-4-31b-it   # RPD 무제한 (AI Studio free tier). role_models로 역할별 override 가능
    rpm: 20
    max_retries: 3
    timeout_s: 300       # thinking 모델 — 코드 생성 응답이 수 분 걸릴 수 있음

analysis:
  overfit_gap: 0.1

harness:
  failure_repeat_threshold: 2
  escalation_window: 5
  escalation_threshold: 2
