# Project config for ai-co-scientist. Codex ignores this file until the project is trusted.
# Measured 2026-09-24 in the retained Orca Codex lane: `/hooks` reports all three project hooks
# active and trusted. Project trust and exact hook-definition trust are separate states.
#
# No sandbox_mode / approval_policy. Whether the sandbox starts on this Windows machine has not
# been measured, and a sandbox that cannot start kills every shell command. It is also the only
# thing on this side that could enforce a read-only lane -- Codex has no per-lane tool allowlist,
# so `tools.claude` generates nothing here. Ledger item 5.
#
# Codex launches command hooks through the Windows platform shell, so POSIX `$()` / `command -v`
# wrappers fail before Python starts. Each registration therefore gives cmd.exe only one portable
# job (`python -c`) and resolves the repo/script inside Python while walking up from the cwd. The
# bare `python` prerequisite is measured on this machine (3.8.10). An unresolved script drains the
# payload, reports on stderr, and exits 0; it never passes in silence. Claude Code's registrations
# remain shell-native in `.claude/settings.json`; `.agent-hooks/test_harness_parity.py` checks both
# name parity and that every Codex command actually launches in the platform shell.

project_doc_max_bytes = 65536
project_root_markers = [".git"]

[[hooks.PostToolUse]]
[[hooks.PostToolUse.hooks]]
type = "command"
command = '''python -c "import pathlib,runpy,sys;root=pathlib.Path.cwd();rel=pathlib.Path('.agent-hooks/check_rules_size.py');script=next((str(p/rel) for p in (root,*root.parents) if (p/rel).is_file()),'');sys.argv=[script];runpy.run_path(script,run_name='__main__') if script else (sys.stdin.read(),print('[rules-size] repo or script unresolved -- size budget NOT checked',file=sys.stderr))"'''
timeout = 15

[[hooks.PostToolUse]]
[[hooks.PostToolUse.hooks]]
type = "command"
command = '''python -c "import pathlib,runpy,sys;root=pathlib.Path.cwd();rel=pathlib.Path('.agent-hooks/build-agents.py');script=next((str(p/rel) for p in (root,*root.parents) if (p/rel).is_file()),'');sys.argv=[script,'--hook'];runpy.run_path(script,run_name='__main__') if script else (sys.stdin.read(),print('[build-agents] repo or script unresolved -- generated lanes NOT rebuilt',file=sys.stderr))"'''
timeout = 20

[[hooks.PreToolUse]]
[[hooks.PreToolUse.hooks]]
type = "command"
command = '''python -c "import pathlib,runpy,sys;root=pathlib.Path.cwd();rel=pathlib.Path('.agent-hooks/block_runtime_commands.py');script=next((str(p/rel) for p in (root,*root.parents) if (p/rel).is_file()),'');sys.argv=[script];runpy.run_path(script,run_name='__main__') if script else (sys.stdin.read(),print('[runtime-lane] repo or script unresolved -- command NOT checked',file=sys.stderr))"'''
timeout = 10

# Lane registration. `config_file` is relative to this file's directory. The role files are
# GENERATED from .agents/agents/*.md -- never hand-edit them; edit the source and run
# `uv run python .agent-hooks/build-agents.py`.
#
# `description` and `nickname_candidates` live HERE rather than in the role file: the binary's
# [agents.*] shape carries exactly description / config_file / nickname_candidates, while the
# role file is parsed as a full config. Whether the role file's own copies are read at all is
# ledger item 3.

[agents.researcher]
description = "Propose the next experiment hypothesis for SEM→Depth and draft its pre-report."
config_file = "agents/researcher.toml"
nickname_candidates = ["researcher"]

[agents.reviewer]
description = "Audit a pre-report before it runs, or a conclusion before it is accepted."
config_file = "agents/reviewer.toml"
nickname_candidates = ["reviewer"]

[agents.engineer]
description = "Write additive pipeline code in src/ and scripts/ with offline tests. Never runs training or submission."
config_file = "agents/engineer.toml"
nickname_candidates = ["engineer"]

[agents.harness_manager]
description = "Own the harness — AGENTS.md, .agents/, .agent-hooks/ and both registrations."
config_file = "agents/harness-manager.toml"
nickname_candidates = ["harness manager"]

[agents.analyst]
description = "Interpret recorded results and keep docs/ current."
config_file = "agents/analyst.toml"
nickname_candidates = ["analyst"]

[agents.executor]
description = "Execute ONE approved experiment and record what happened. Exclusive: never two at once."
config_file = "agents/executor.toml"
nickname_candidates = ["executor"]
